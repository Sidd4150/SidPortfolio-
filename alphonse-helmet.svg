<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded badge background -->
  <rect width="64" height="64" rx="14" fill="#0d111d" />

  <!-- Trailing Hair Plume (Behind the Horn) -->
  <path d="M 32,14 C 40,9 48,11 52,16 C 50,22 44,21 36,17 Z" fill="#2d3748" stroke="#080c14" stroke-width="0.9" />
  <path d="M 35,15 C 41,12 47,13 50,17" stroke="#4a5568" stroke-width="0.8" fill="none" />

  <!-- Back Neck / Collar Armor (Base) -->
  <path d="M 12,52 L 7,62 L 21,63 L 25,57 Z" fill="#334155" stroke="#080c14" stroke-width="1.3" stroke-linejoin="round" />
  <path d="M 52,52 L 57,62 L 43,63 L 39,57 Z" fill="#1e293b" stroke="#080c14" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Main Cranium Dome -->
  <path d="M 10,32 C 10,18 19,14 32,14 C 45,14 54,18 54,32 L 54,38 L 10,38 Z" fill="#78889b" stroke="#080c14" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Dome Left Highlight -->
  <path d="M 11,32 C 11,19 19,15 32,15 L 32,37 L 11,37 Z" fill="#cbd5e1" opacity="0.45" />

  <!-- Top Center Spike / Conical Horn -->
  <!-- Left Highlight Half -->
  <path d="M 32,1 L 28.5,16 L 32,16 Z" fill="#e2e8f0" stroke="#080c14" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Right Shadow Half -->
  <path d="M 32,1 L 32,16 L 35.5,16 Z" fill="#64748b" stroke="#080c14" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Horn Base Collar Ring -->
  <ellipse cx="32" cy="16" rx="4" ry="1.4" fill="#475569" stroke="#080c14" stroke-width="1.1" />

  <!-- Forehead Brow Band -->
  <path d="M 8.5,30 Q 32,26.5 55.5,30 L 55.5,35.5 Q 32,33 8.5,35.5 Z" fill="#5f6e80" stroke="#080c14" stroke-width="1.3" stroke-linejoin="round" />
  <path d="M 9.5,31 Q 32,28 54.5,31 L 54.5,33 Q 32,30 9.5,33 Z" fill="#94a3b8" opacity="0.6" />
  <!-- Brow Rivets -->
  <circle cx="18" cy="32.5" r="1.1" fill="#080c14" />
  <circle cx="46" cy="32.5" r="1.1" fill="#080c14" />

  <!-- Temple / Ear Pivot Disks -->
  <circle cx="7.5" cy="38" r="3.5" fill="#64748b" stroke="#080c14" stroke-width="1.3" />
  <circle cx="7.5" cy="38" r="1.3" fill="#334155" />
  <circle cx="56.5" cy="38" r="3.5" fill="#475569" stroke="#080c14" stroke-width="1.3" />
  <circle cx="56.5" cy="38" r="1.3" fill="#1e293b" />

  <!-- Cheek Plates & Jaw Shape -->
  <path d="M 9,37 L 10,47 L 22,57 L 27,61 L 37,61 L 42,57 L 54,47 L 55,37 Z" fill="#78889b" stroke="#080c14" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Cheek Left Highlight -->
  <path d="M 10,38 L 11,46 L 22,56 L 27,60 L 32,60 L 32,38 Z" fill="#cbd5e1" opacity="0.35" />

  <!-- Half-Moon Eye Sockets (Alphonse's Crescent Eyes) -->
  <path d="M 15,37 Q 21.5,34.5 28,37 C 28,42.5 15,42.5 15,37 Z" fill="#060911" stroke="#080c14" stroke-width="1.1" stroke-linejoin="round" />
  <path d="M 36,37 Q 42.5,34.5 49,37 C 49,42.5 36,42.5 36,37 Z" fill="#060911" stroke="#080c14" stroke-width="1.1" stroke-linejoin="round" />

  <!-- Crimson Soul Lights (Alphonse's Alchemical Soul Glow) -->
  <circle cx="21.5" cy="39" r="2.2" fill="#ef4444" />
  <circle cx="21.5" cy="39" r="0.9" fill="#fee2e2" />
  <circle cx="42.5" cy="39" r="2.2" fill="#ef4444" />
  <circle cx="42.5" cy="39" r="0.9" fill="#fee2e2" />

  <!-- Horizontal Cheek Vents (2 parallel horizontal slits under each eye) -->
  <!-- Left Vents -->
  <line x1="17" y1="45" x2="25.5" y2="45" stroke="#080c14" stroke-width="1.5" stroke-linecap="round" />
  <line x1="18" y1="48.5" x2="24.5" y2="48.5" stroke="#080c14" stroke-width="1.5" stroke-linecap="round" />
  <!-- Right Vents -->
  <line x1="38.5" y1="45" x2="47" y2="45" stroke="#080c14" stroke-width="1.5" stroke-linecap="round" />
  <line x1="39.5" y1="48.5" x2="46" y2="48.5" stroke="#080c14" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Faceplate Ridge -->
  <line x1="32" y1="35" x2="32" y2="50" stroke="#080c14" stroke-width="1.2" />

  <!-- Fang Motif (Two triangular notches above chin) -->
  <polygon points="27.5,51 29.5,55 32,52 34.5,55 36.5,51" fill="#080c14" />

  <!-- Protruding Chin Guard Plate -->
  <path d="M 26,55.5 L 32,53 L 38,55.5 L 36,62 L 28,62 Z" fill="#5f6e80" stroke="#080c14" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Chin Highlight -->
  <path d="M 27,56 L 32,54 L 32,61.5 L 28.5,61.5 Z" fill="#94a3b8" />
</svg>
